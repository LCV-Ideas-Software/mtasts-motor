version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
      exclude:
        - "actions/*"
        - "github/*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
      codeql-action-security-updates:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "npm"
      - "worker"
    commit-message:
      prefix: "deps"
      include: "scope"
    versioning-strategy: increase
    groups:
      dev-dependencies:
        patterns:
          - "@eslint/*"
          - "eslint*"
          - "globals"
          - "markdownlint*"
          - "prettier"
          - "typescript"
          - "typescript-eslint"
          - "@types/*"
          - "wrangler"
          - "@cloudflare/*"
          - "vite*"
          - "@vitest/*"
          - "@biomejs/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint 8.67.0 supports TypeScript only through 6.x.
      # Remove this bound after its published peer range includes TypeScript 7.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0 <8.0.0"
    open-pull-requests-limit: 10
